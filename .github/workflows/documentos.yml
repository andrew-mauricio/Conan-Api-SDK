# Document guard.
#
# On 2026-08-18 a single commit deleted the README, both language mirrors, the
# LICENSE, the .gitignore, PUBLICAR-PLUGIN.md and the five images -- 11 files at
# once, none of them recreated afterwards. Nothing complained, and the
# repository spent twelve hours with no front page and no licence.
#
# This guard DETECTS that and marks the commit with a red X. It does NOT block
# the push: blocking would need branch protection in the repository settings,
# which would also stop pushing straight to main.

name: documents

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the documents
        run: python3 .github/scripts/conferir-documentos.py .

# Guarda dos documentos.
#
# Em 18/08/2026 um commit apagou o README, os dois espelhos de idioma, a
# LICENSE, o .gitignore, o PUBLICAR-PLUGIN.md e as cinco imagens -- 11 arquivos
# de uma vez, nenhum recriado depois. Nada reclamou, e o repositorio passou
# doze horas sem pagina inicial e sem licenca.
#
# Esta guarda DETECTA e marca o commit com um X vermelho. Ela NAO impede o
# push: para impedir, seria preciso ligar branch protection nas configuracoes
# do repositorio, o que tambem passaria a barrar push direto na main.

name: documentos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir os documentos
        run: python3 .github/scripts/conferir-documentos.py .
